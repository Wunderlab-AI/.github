name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, don't use this form. See our security policy instead.
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - scheduler
        - agents
        - models
        - memory
        - sandbox / env
        - daemon / cli
        - engines
        - server
        - web
        - apps
        - roles
        - bench
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, CPU, GPU and driver, memory, and the models involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues, and this is not a security problem.
          required: true
